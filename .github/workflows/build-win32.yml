name: Build Win32

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      napi-type:
        required: false
        type: string
        default: direct
      graphics-api:
        required: false
        type: string
        default: D3D11
      enable-sanitizers:
        required: false
        type: boolean
        default: false
      visual-tests:
        description: "legacy, shadow (non-blocking Playwright comparison), or replace (coverage-gated)"
        required: false
        type: string
        default: legacy
      babylonjs-repository:
        required: false
        type: string
        default: BabylonJS/Babylon.js
      babylonjs-ref:
        description: "Full commit SHA containing the native Playwright project"
        required: false
        type: string
        default: ""

# Absorb transient npm registry / CDN flakes during `npm install` in Apps/CMakeLists.txt.
# npm's default fetch-retries is 2; bump to 5 (npm's own exponential backoff handles spacing).
env:
  npm_config_fetch_retries: '5'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: ${{ inputs.visual-tests != 'legacy' && 120 || 60 }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate visual migration inputs
        shell: pwsh
        env:
          VISUAL_TESTS: ${{ inputs.visual-tests }}
          SUITE_REF: ${{ inputs.babylonjs-ref }}
          GRAPHICS_API: ${{ inputs.graphics-api }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          if ($env:VISUAL_TESTS -notin @('legacy', 'shadow', 'replace')) {
            throw 'visual-tests must be legacy, shadow, or replace.'
          }
          if ($env:VISUAL_TESTS -ne 'legacy') {
            if ($env:SUITE_REF -notmatch '^[0-9a-fA-F]{40}$') {
              throw 'The native suite must be pinned to a full Babylon.js commit SHA.'
            }
            if ($env:GRAPHICS_API -ne 'D3D11' -or $env:PLATFORM -ne 'x64') {
              throw 'The first Playwright migration supports Win32 x64 D3D11 only.'
            }
          }

      - name: Set variables
        id: vars
        shell: bash
        run: |
          SUFFIX=""
          JS_DEFINE=""
          if [ "${{ inputs.napi-type }}" = "jsi" ]; then
            SUFFIX="_JSI"
            JS_DEFINE="-DNAPI_JAVASCRIPT_ENGINE=JSI"
          elif [ "${{ inputs.napi-type }}" = "V8" ]; then
            SUFFIX="_V8"
            JS_DEFINE="-DNAPI_JAVASCRIPT_ENGINE=V8"
          elif [ "${{ inputs.napi-type }}" = "Hermes" ]; then
            SUFFIX="_Hermes"
            JS_DEFINE="-DNAPI_JAVASCRIPT_ENGINE=Hermes -DHERMES_ALLOW_BOOST_CONTEXT=0"
          elif [ "${{ inputs.napi-type }}" = "QuickJS" ]; then
            SUFFIX="_QuickJS"
            JS_DEFINE="-DNAPI_JAVASCRIPT_ENGINE=QuickJS"
          fi
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "js_define=$JS_DEFINE" >> "$GITHUB_OUTPUT"
          echo "solution_name=Win32_${{ inputs.platform }}${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "sanitizer_flag=${{ inputs.enable-sanitizers && 'ON' || 'OFF' }}" >> "$GITHUB_OUTPUT"

      - name: Generate solution
        shell: cmd
        run: |
          cmake -G "Visual Studio 17 2022" ^
            -B build/${{ steps.vars.outputs.solution_name }} ^
            -A ${{ inputs.platform }} ^
            ${{ steps.vars.outputs.js_define }} ^
            -D BX_CONFIG_DEBUG=ON ^
            -D GRAPHICS_API=${{ inputs.graphics-api }} ^
            -D BABYLON_DEBUG_TRACE=ON ^
            -D BABYLON_NATIVE_PLUGIN_NATIVEDRACO=ON ^
            -D BABYLON_NATIVE_PLUGIN_NATIVEMESHOPT=ON ^
            -D ENABLE_SANITIZERS=${{ steps.vars.outputs.sanitizer_flag }}

      - name: Build
        shell: cmd
        run: |
          cmake --build build/${{ steps.vars.outputs.solution_name }} --config RelWithDebInfo -- /m

      - name: Enable Crash Dumps
        shell: cmd
        run: |
          reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\Playground.exe" /f
          reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\Playground.exe" /v DumpType /t REG_DWORD /d 2 /f
          reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\Playground.exe" /v DumpCount /t REG_DWORD /d 1 /f
          reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\Playground.exe" /v DumpFolder /t REG_SZ /d "%RUNNER_TEMP%\Dumps" /f
          reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\UnitTests.exe" /f
          reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\UnitTests.exe" /v DumpType /t REG_DWORD /d 2 /f
          reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\UnitTests.exe" /v DumpCount /t REG_DWORD /d 1 /f
          reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\UnitTests.exe" /v DumpFolder /t REG_SZ /d "%RUNNER_TEMP%\Dumps" /f

      - name: Add ASAN runtime DLLs to PATH
        if: ${{ inputs.enable-sanitizers }}
        shell: powershell
        run: |
          $vs = vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $msvc = Get-ChildItem "$vs\VC\Tools\MSVC" | Sort-Object Name -Descending | Select-Object -First 1
          $asanPath = "$($msvc.FullName)\bin\Hostx64\x64"
          Write-Host "Adding ASAN runtime folder to PATH: $asanPath"
          echo "$asanPath" >> $env:GITHUB_PATH

      - name: Disable JIT Debugger for Script
        shell: cmd
        run: |
          for /f %%i in ('vswhere -property instanceId') do (
            reg add HKCU\Software\Microsoft\VisualStudio\Debugger\JIT\{F200A7E7-DEA5-11D0-B854-00A0244A1DE2}\%%i /f /v Disabled /t REG_DWORD /d 1
          )

      - name: Validation Tests
        if: ${{ inputs.graphics-api != 'D3D12' && inputs.visual-tests != 'replace' }}
        shell: cmd
        run: |
          cd build\${{ steps.vars.outputs.solution_name }}\Apps\Playground\RelWithDebInfo
          Playground app:///Scripts/validation_native.js

      - name: Checkout shared Babylon.js visualization suite
        id: suite-checkout
        if: ${{ !cancelled() && inputs.visual-tests != 'legacy' }}
        continue-on-error: ${{ inputs.visual-tests == 'shadow' }}
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.babylonjs-repository }}
          ref: ${{ inputs.babylonjs-ref }}
          path: .playwright-babylonjs
          persist-credentials: false

      - name: Set up Node for native visualization
        id: suite-node
        if: ${{ !cancelled() && inputs.visual-tests != 'legacy' && steps.suite-checkout.outcome == 'success' }}
        continue-on-error: ${{ inputs.visual-tests == 'shadow' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .playwright-babylonjs/package-lock.json

      - name: Set up npm for the shared suite
        id: suite-npm
        if: ${{ !cancelled() && inputs.visual-tests != 'legacy' && steps.suite-node.outcome == 'success' }}
        continue-on-error: ${{ inputs.visual-tests == 'shadow' }}
        run: npm install --global npm@11.18.0

      - name: Install shared suite dependencies
        id: suite-install
        if: ${{ !cancelled() && inputs.visual-tests != 'legacy' && steps.suite-npm.outcome == 'success' }}
        continue-on-error: ${{ inputs.visual-tests == 'shadow' }}
        working-directory: .playwright-babylonjs
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Native Playwright visualization
        id: native-playwright
        if: ${{ !cancelled() && inputs.visual-tests != 'legacy' && steps.suite-install.outcome == 'success' }}
        continue-on-error: ${{ inputs.visual-tests == 'shadow' }}
        timeout-minutes: 60
        shell: pwsh
        env:
          VISUAL_TESTS: ${{ inputs.visual-tests }}
          SOLUTION_NAME: ${{ steps.vars.outputs.solution_name }}
        run: |
          & .\Apps\scripts\runPlaywright.ps1 `
            -BabylonJsRoot .\.playwright-babylonjs `
            -Playground ".\build\$env:SOLUTION_NAME\Apps\Playground\RelWithDebInfo\Playground.exe" `
            -Artifacts "$env:RUNNER_TEMP\native-playwright" `
            -Mode $env:VISUAL_TESTS `
            -Workers 2

      - name: Summarize native migration readiness
        if: ${{ !cancelled() && inputs.visual-tests != 'legacy' }}
        shell: pwsh
        env:
          NATIVE_OUTCOME: ${{ steps.native-playwright.outcome }}
        run: |
          "## Native Playwright: $env:NATIVE_OUTCOME" >> $env:GITHUB_STEP_SUMMARY
          $report = "$env:RUNNER_TEMP\native-playwright\migration.json"
          if (Test-Path $report) {
            $data = Get-Content $report -Raw | ConvertFrom-Json
            "Selected: $($data.summary.selected); results: $($data.summary.statuses | ConvertTo-Json -Compress)" >> $env:GITHUB_STEP_SUMMARY
            "Legacy coverage passing: $($data.coverage.coveredAndPassing)/$($data.coverage.legacyRunnable)" >> $env:GITHUB_STEP_SUMMARY
            "Ready for cutover: $($data.coverage.readyForCutover)" >> $env:GITHUB_STEP_SUMMARY
          } else {
            "No complete migration report was produced. This run does not establish readiness." >> $env:GITHUB_STEP_SUMMARY
          }
          if ($env:NATIVE_OUTCOME -ne 'success') {
            Write-Output '::warning::Native Playwright did not pass. Inspect the migration report; do not remove legacy validation.'
          }

      - name: Upload native Playwright report and image diffs
        if: ${{ !cancelled() && inputs.visual-tests != 'legacy' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.vars.outputs.solution_name }}-${{ inputs.graphics-api }}${{ inputs.enable-sanitizers && '-sanitizer' || '' }}-playwright
          path: ${{ runner.temp }}/native-playwright/
          if-no-files-found: warn

      - name: Upload Rendered Pictures
        if: ${{ inputs.graphics-api != 'D3D12' && !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.vars.outputs.solution_name }}-${{ inputs.graphics-api }}${{ inputs.enable-sanitizers && '-sanitizer' || '' }}-rendered-pictures
          path: build/${{ steps.vars.outputs.solution_name }}/Apps/Playground/Results
          if-no-files-found: ignore

      - name: Upload Error Pictures
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.vars.outputs.solution_name }}-${{ inputs.graphics-api }}${{ inputs.enable-sanitizers && '-sanitizer' || '' }}-error-pictures
          path: build/${{ steps.vars.outputs.solution_name }}/Apps/Playground/Errors
          if-no-files-found: ignore

      - name: Stage Playground Crash Dump
        if: ${{ !cancelled() && (failure() || steps.native-playwright.outcome == 'failure') }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\Dumps" | Out-Null
          Copy-Item -Path "build\${{ steps.vars.outputs.solution_name }}\Apps\Playground\RelWithDebInfo\Playground.*" -Destination "$env:RUNNER_TEMP\Dumps\" -ErrorAction SilentlyContinue

      - name: Unit Tests
        if: ${{ inputs.graphics-api != 'D3D12' }}
        shell: cmd
        run: |
          cd build\${{ steps.vars.outputs.solution_name }}\Apps\UnitTests\RelWithDebInfo
          UnitTests

      - name: Module Load Test
        if: ${{ !inputs.enable-sanitizers }}
        shell: cmd
        run: |
          cd build\${{ steps.vars.outputs.solution_name }}\Apps\ModuleLoadTest\RelWithDebInfo
          ModuleLoadTest

      - name: Stage UnitTests Crash Dump
        if: failure()
        shell: powershell
        run: |
          Copy-Item -Path "build\${{ steps.vars.outputs.solution_name }}\Apps\UnitTests\RelWithDebInfo\UnitTests.*" -Destination "$env:RUNNER_TEMP\Dumps\" -ErrorAction SilentlyContinue

      - name: Upload Crash Dumps
        if: ${{ !cancelled() && (failure() || steps.native-playwright.outcome == 'failure') }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.vars.outputs.solution_name }}-${{ inputs.graphics-api }}${{ inputs.enable-sanitizers && '-sanitizer' || '' }}-crash-dumps
          path: ${{ runner.temp }}/Dumps/
          if-no-files-found: ignore
