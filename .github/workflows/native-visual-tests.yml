name: Native visual migration (Win32 D3D11)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Shadow keeps legacy validation; replace requires full passing coverage"
        type: choice
        options:
          - shadow
          - replace
        default: shadow
      babylonjs-repository:
        description: "Repository containing the shared native Playwright project"
        type: string
        default: BabylonJS/Babylon.js
      babylonjs-ref:
        description: "Full Babylon.js commit SHA containing the integration"
        type: string
        required: true

permissions:
  contents: read

jobs:
  win32-d3d11:
    uses: ./.github/workflows/build-win32.yml
    with:
      platform: x64
      graphics-api: D3D11
      visual-tests: ${{ inputs.mode }}
      babylonjs-repository: ${{ inputs.babylonjs-repository }}
      babylonjs-ref: ${{ inputs.babylonjs-ref }}
